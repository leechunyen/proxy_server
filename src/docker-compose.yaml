name: proxy_server
version: '3.8'

services:
  proxy:
    build: .
    image: proxy_server:latest
    container_name: proxy_server
    ports:
      - "1080:1080"
    volumes:
      # --- [Option A] Bind Mount ---
      # Benefit: You can directly edit config.json in the local ./data directory.
      # (Enabled by default)
      - ./data:/app/data

      # --- [Option B] Named Volume ---
      # Benefit: Let Docker manage the data storage location, suitable for production.
      # (To use this option, uncomment the line below and comment out the ./data line above)
      # - proxy_data:/app/data

    # --- [Network Mode Option] ---
    # To let the container use the host's network stack directly, uncomment the line below.
    # Note: You must also comment out the entire 'ports' section above, as host mode does not use port mapping.
    # network_mode: "host"

    restart: unless-stopped

# To use [Option B], uncomment the two lines below
# volumes:
#   proxy_data: