version: '3.8'

services:
  proxy:
    build: .
    image: proxy_server:latest
    container_name: proxy_server
    ports:
      - "1080:1080"
    volumes:
      # --- 【選項 A】綁定本機目錄 (Bind Mount) ---
      # 優點：你可以直接在當前目錄的 ./data 裡修改 config.json
      # (預設啟用此項)
      - ./data:/app/data

      # --- 【選項 B】使用 Docker 具名卷宗 (Named Volume) ---
      # 優點：交由 Docker 統一管理資料存放位置，適合正式伺服器部署
      # (若要使用此項，請取消下方註解，並把上方的 ./data 註解掉)
      # - proxy_data:/app/data

    restart: unless-stopped

# 若要使用【選項 B】，請將下面兩行的註解取消
# volumes:
#   proxy_data:
